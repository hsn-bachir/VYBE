services:
  core-postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vybe_core_test
      POSTGRES_USER: vybe_test
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vybe_test -d vybe_core_test"]
      interval: 2s
      timeout: 2s
      retries: 20

  catalog-postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vybe_movies_test
      POSTGRES_USER: vybe_test
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vybe_test -d vybe_movies_test"]
      interval: 2s
      timeout: 2s
      retries: 20
