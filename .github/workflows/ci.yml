name: VYBE CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  core-tests:
    name: Core API Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vybe_core_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vybe_core_test
          POSTGRES_USER: vybe_test
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vybe_test -d vybe_core_test"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: vybe_core_test
      DB_USERNAME: root
      DB_PASSWORD: root
      VYBE_DISPOSABLE_TEST_DB: '1'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, pdo_pgsql, bcmath, xml, pdo_sqlite, gd, exif
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify Core MySQL migrations
        run: php artisan migrate --force
      - name: Run Core PHPUnit suite
        run: php artisan test
      - name: Verify Core PostgreSQL migrations
        env:
          DB_CONNECTION: pgsql
          DB_URL: ''
          DB_PORT: '5432'
          DB_DATABASE: vybe_core_test
          DB_USERNAME: vybe_test
          DB_PASSWORD: ci_test_only
          DB_SSLMODE: disable
        run: php artisan migrate --force
      - name: Run Core PostgreSQL suite
        env:
          DB_CONNECTION: pgsql
          DB_URL: ''
          DB_PORT: '5432'
          DB_DATABASE: vybe_core_test
          DB_USERNAME: vybe_test
          DB_PASSWORD: ci_test_only
          DB_SSLMODE: disable
        run: php artisan test

  catalog-tests:
    name: Movie Catalog Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vybe_movies_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vybe_movies_test
          POSTGRES_USER: vybe_test
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vybe_test -d vybe_movies_test"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=20
    defaults:
      run:
        working-directory: services/movie-catalog
    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CATALOG_INTERNAL_TOKEN: catalog-ci-only-test-token
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: vybe_movies_test
      DB_USERNAME: root
      DB_PASSWORD: root
      VYBE_DISPOSABLE_TEST_DB: '1'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, pdo_pgsql, bcmath, xml, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify Catalog MySQL migrations
        run: php artisan migrate --force
      - name: Run Catalog PHPUnit suite
        run: php artisan test
      - name: Verify Catalog PostgreSQL migrations
        env:
          DB_CONNECTION: pgsql
          DB_URL: ''
          DB_PORT: '5432'
          DB_DATABASE: vybe_movies_test
          DB_USERNAME: vybe_test
          DB_PASSWORD: ci_test_only
          DB_SSLMODE: disable
        run: php artisan migrate --force
      - name: Run Catalog PostgreSQL suite
        env:
          DB_CONNECTION: pgsql
          DB_URL: ''
          DB_PORT: '5432'
          DB_DATABASE: vybe_movies_test
          DB_USERNAME: vybe_test
          DB_PASSWORD: ci_test_only
          DB_SSLMODE: disable
        run: php artisan test

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm test
      - run: npm run build
